# Local PostgreSQL for development and tests.
# The application itself is NOT containerised here — run it with `npm run dev`
# so hot reload works. This file exists to make the database a one-command
# dependency. A non-Docker path is documented in the README.
#
#   docker compose up -d db
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and delete data

services:
  db:
    image: postgres:16-alpine
    container_name: diligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diligence
      POSTGRES_PASSWORD: diligence_local_dev
      POSTGRES_DB: diligence_dev
    ports:
      - '5432:5432'
    volumes:
      - diligence-pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first boot so `npm test` has a
      # throwaway target that is never the development database.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diligence -d diligence_dev']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  diligence-pgdata:
