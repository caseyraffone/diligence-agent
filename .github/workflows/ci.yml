name: CI

# CI runs with NO API keys and NO third-party network access.
# The application is designed so this is sufficient: LLM_PROVIDER=mock is
# deterministic and offline, and ENABLE_LIVE_SOURCES=false serves every source
# adapter from recorded fixtures. A pull request that needs a secret to go green
# has broken that property and should be rejected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diligence
          POSTGRES_PASSWORD: diligence_local_dev
          POSTGRES_DB: diligence_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diligence -d diligence_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://diligence:diligence_local_dev@127.0.0.1:5432/diligence_dev?schema=public
      TEST_DATABASE_URL: postgresql://diligence:diligence_local_dev@127.0.0.1:5432/diligence_test?schema=public
      # Non-secret, CI-only values. Real deployments generate their own.
      APP_SECRET: ci-only-not-a-secret-value-padded-to-length-000000
      DOCUMENT_ENCRYPTION_KEY: ci-only-not-a-secret-key-0000000
      APP_BASE_URL: http://localhost:3200
      LLM_PROVIDER: mock
      ENABLE_LIVE_SOURCES: 'false'
      OBJECT_STORE_DRIVER: local
      OBJECT_STORE_LOCAL_PATH: ./storage
      MALWARE_SCANNER: noop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: PGPASSWORD=diligence_local_dev psql -h 127.0.0.1 -U diligence -d diligence_dev -c 'CREATE DATABASE diligence_test OWNER diligence;'

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Seed demonstration data
        run: npm run db:seed

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diligence
          POSTGRES_PASSWORD: diligence_local_dev
          POSTGRES_DB: diligence_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diligence -d diligence_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://diligence:diligence_local_dev@127.0.0.1:5432/diligence_dev?schema=public
      APP_SECRET: ci-only-not-a-secret-value-padded-to-length-000000
      DOCUMENT_ENCRYPTION_KEY: ci-only-not-a-secret-key-0000000
      APP_BASE_URL: http://localhost:3200
      LLM_PROVIDER: mock
      ENABLE_LIVE_SOURCES: 'false'
      OBJECT_STORE_DRIVER: local
      OBJECT_STORE_LOCAL_PATH: ./storage
      MALWARE_SCANNER: noop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
